[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imovel-scrapper"
version = "0.1.0"
description = "Pipeline de identificação de oportunidades imobiliárias em Belo Horizonte"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "xlsxwriter>=3.1.0",
    "playwright>=1.40.0",
    "crawlee[playwright]>=0.4.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "W293"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"crawlee_scraper.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
